[defaults]
inventory = inventory.yml
host_key_checking = True
stdout_callback = default
result_format = yaml
interpreter_python = auto_silent

[ssh_connection]
pipelining = True
# Reuse one SSH connection per run: the firewall rate-limits new SSH
# connections (6 per 30 s), and a run opening one per task would trip it.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
