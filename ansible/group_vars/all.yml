# Single source of truth for the print server. Edit, then `make plan` / `make apply`.

admin_user: tomasz
timezone: Europe/Warsaw

# Only this network may reach SSH, IPP (631) and mDNS (5353). Match your router's LAN.
lan_cidr: 192.168.1.0/24

# Printer queue
printer_name: LaserJet                      # shown on iPhones/Macs; no spaces
printer_description: HP LaserJet Pro P1102w
printer_location: Home
printer_model_match: P1102                  # used to find the USB device and the driver
printer_ppd: ""                             # leave empty to auto-pick; override with a value from `lpinfo -m`

# Queue defaults (driver options). List all choices on the Pi: lpoptions -p LaserJet -l
printer_options:
  PageSize: A4
  Density: Density5                         # Density1 (lightest) … Density5 (darkest); Windows "Print Density"
  Quality: normal                           # normal = 1200x600 dpi, the driver's maximum; draft = toner saver

# Open-source host-based driver (foo2zjs). Add "hplip" only if foo2zjs output is wrong.
driver_packages:
  - printer-driver-foo2zjs

# Security updates
unattended_reboot_time: "04:00"

# ---------- Hardening ----------
# Outbound traffic from the Pi.
#   restricted: only DNS, NTP, HTTP(S) for updates, DHCP and mDNS (default)
#   open:       anything (use temporarily if you need to debug network access)
egress_policy: restricted

# Extra names clients may use to reach CUPS, besides <hostname> and <hostname>.local.
# Add your router's DNS name if you print via it, e.g. printsrv.lan. IP addresses always work.
cups_extra_server_aliases: []

# Largest print job accepted, in MB.
cups_max_job_size_mb: 100
