---
# Declarative AirPrint print server for a USB printer on Raspberry Pi OS Lite (Trixie).
# Dry run:  ansible-playbook site.yml --check --diff
# Apply:    ansible-playbook site.yml

- name: AirPrint print server
  hosts: printsrv
  become: true
  environment:
    LC_ALL: C.UTF-8  # command output is parsed below; keep it untranslated

  handlers:
    - name: Restart ssh
      ansible.builtin.service:
        name: ssh
        state: restarted

    - name: Restart cups
      ansible.builtin.service:
        name: cups
        state: restarted

    - name: Restart avahi
      ansible.builtin.service:
        name: avahi-daemon
        state: restarted

    - name: Reboot
      ansible.builtin.reboot:
        reboot_timeout: 600
      when: not (image_build | default(false))  # the image build pre-applies boot config; nothing to reboot

    - name: Reexec systemd
      ansible.builtin.systemd_service:
        daemon_reexec: true
      when: not (image_build | default(false))  # no running systemd inside the image-build chroot

    - name: Restart journald
      ansible.builtin.service:
        name: systemd-journald
        state: restarted

  tasks:
    # ---------- Base system ----------
    - name: Set timezone
      community.general.timezone:
        name: "{{ timezone }}"

    # Runs only when asked for by tag: at image build time (`packages`) and from `make upgrade`.
    # Day to day, unattended-upgrades keeps the Pi current; a plain `make apply` stays fast.
    - name: Upgrade system packages
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
        upgrade: safe
      tags: [never, packages, upgrade]

    # cups-browsed (remote printer discovery, CVE-2024-47176) listens on UDP 631 and is pulled in as a
    # recommendation on some Debian releases. Pin it out so no upgrade can ever bring it back.
    - name: Forbid cups-browsed
      ansible.builtin.copy:
        dest: /etc/apt/preferences.d/no-cups-browsed
        content: |
          Package: cups-browsed
          Pin: release *
          Pin-Priority: -1
        mode: "0644"
      tags: [packages]

    - name: Install packages
      ansible.builtin.apt:
        name: "{{ ['cups', 'cups-filters', 'avahi-daemon', 'ufw', 'unattended-upgrades', 'uhubctl'] + driver_packages }}"
        state: present
      tags: [packages]

    # apt-listchanges does nothing without a terminal or a mail transport.
    - name: Remove unwanted packages
      ansible.builtin.apt:
        name: [cups-browsed, apt-listchanges]
        state: absent
        purge: true
      tags: [packages]

    # Tag `bootconfig`: also applied at image build time, so the first boot needs no reboot.
    - name: Disable Bluetooth (unused attack surface)
      ansible.builtin.lineinfile:
        path: /boot/firmware/config.txt
        line: dtoverlay=disable-bt
        insertafter: EOF
      notify: Reboot
      tags: [bootconfig]

    - name: Disable Wi-Fi (wired via PoE; unused attack surface)
      ansible.builtin.lineinfile:
        path: /boot/firmware/config.txt
        line: dtoverlay=disable-wifi
        insertafter: EOF
      notify: Reboot
      tags: [bootconfig]

    - name: Quieter PoE+ HAT fan (starts at 65 °C instead of ~40 °C)
      ansible.builtin.blockinfile:
        path: /boot/firmware/config.txt
        marker: "# {mark} ANSIBLE poe-fan"
        block: |
          dtparam=poe_fan_temp0=65000,poe_fan_temp0_hyst=5000
          dtparam=poe_fan_temp1=70000,poe_fan_temp1_hyst=2000
          dtparam=poe_fan_temp2=75000,poe_fan_temp2_hyst=2000
          dtparam=poe_fan_temp3=80000,poe_fan_temp3_hyst=2000
      notify: Reboot
      tags: [bootconfig]

    # A hung kernel reboots itself instead of waiting for someone to reach the Pi.
    - name: Enable hardware watchdog
      ansible.builtin.lineinfile:
        path: /boot/firmware/config.txt
        line: dtparam=watchdog=on
        insertafter: EOF
      notify: Reboot
      tags: [bootconfig]

    - name: Create systemd drop-in directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /etc/systemd/system.conf.d
        - /etc/systemd/journald.conf.d
      tags: [bootconfig]

    - name: Let systemd feed the hardware watchdog
      ansible.builtin.copy:
        dest: /etc/systemd/system.conf.d/10-watchdog.conf
        content: |
          [Manager]
          RuntimeWatchdogSec=15s
          RebootWatchdogSec=2min
        mode: "0644"
      notify: Reexec systemd
      tags: [bootconfig]

    # ---------- Observability ----------
    # Raspberry Pi OS keeps the journal in RAM: after an unattended reboot or a crash there is nothing
    # to read. Persist it, bounded so it can never fill the card.
    - name: Persist a bounded journal across reboots
      ansible.builtin.copy:
        dest: /etc/systemd/journald.conf.d/10-persistent.conf
        content: |
          [Journal]
          Storage=persistent
          SystemMaxUse=64M
        mode: "0644"
      notify: Restart journald

    - name: Stop Bluetooth UART service
      ansible.builtin.service:
        name: hciuart
        enabled: false
        state: stopped
      failed_when: false

    # ---------- SSH hardening ----------
    - name: Harden sshd
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/10-hardening.conf
        content: |
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PermitRootLogin no
          AllowUsers {{ admin_user }}
        mode: "0644"
        validate: /usr/sbin/sshd -t -f %s
      notify: Restart ssh

    # ---------- Automatic security updates ----------
    - name: Enable periodic unattended upgrades
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
        mode: "0644"

    - name: Configure unattended-upgrades origins and reboot window
      ansible.builtin.template:
        src: 52unattended-upgrades-local.j2
        dest: /etc/apt/apt.conf.d/52unattended-upgrades-local
        mode: "0644"

    # ---------- Firewall ----------
    - name: Allow LAN-only services
      community.general.ufw:
        rule: allow
        src: "{{ lan_cidr }}"
        port: "{{ item.port }}"
        proto: "{{ item.proto }}"
        comment: "{{ item.comment }}"
      loop:
        - { port: "22", proto: tcp, comment: ssh }
        - { port: "631", proto: tcp, comment: ipp-airprint }
        - { port: "5353", proto: udp, comment: mdns }

    - name: Deny everything else inbound and enable firewall
      community.general.ufw:
        state: enabled
        direction: incoming
        policy: deny

    # ---------- mDNS ----------
    - name: Advertise over IPv4 only (firewall rules are IPv4 LAN-only)
      community.general.ini_file:
        path: /etc/avahi/avahi-daemon.conf
        section: "{{ item.section }}"
        option: "{{ item.option }}"
        value: "{{ item.value }}"
        no_extra_spaces: true  # avahi rejects "key = value"
        mode: "0644"
      loop:
        - { section: server, option: use-ipv6, value: "no" }
        - { section: publish, option: publish-aaaa-on-ipv4, value: "no" }
      notify: Restart avahi

    - name: Enable Avahi
      ansible.builtin.service:
        name: avahi-daemon
        enabled: true
        state: started

    # ---------- CUPS ----------
    # One place to look: `journalctl -u cups` instead of files under /var/log/cups.
    - name: Send CUPS logs to the journal
      ansible.builtin.lineinfile:
        path: /etc/cups/cups-files.conf
        regexp: '^#?\s*{{ item }}\s'
        line: "{{ item }} syslog"
        insertafter: EOF
        validate: /usr/sbin/cupsd -t -s %s
      loop: [ErrorLog, AccessLog]
      notify: Restart cups

    - name: Configure cupsd
      ansible.builtin.template:
        src: cupsd.conf.j2
        dest: /etc/cups/cupsd.conf
        owner: root
        group: lp
        mode: "0640"
        validate: /usr/sbin/cupsd -t -c %s
      notify: Restart cups

    - name: Enable CUPS
      ansible.builtin.service:
        name: cups
        enabled: true
        state: started

    - name: Apply pending service restarts before configuring the queue
      ansible.builtin.meta: flush_handlers

    # ---------- Printer queue ----------
    - name: Discover USB printers
      ansible.builtin.command: lpinfo --include-schemes usb -v
      register: lpinfo_devices
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Discover drivers
      ansible.builtin.command: lpinfo -m
      register: lpinfo_models
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Resolve device URI and driver
      vars:
        uri_candidates: >-
          {{ lpinfo_devices.stdout_lines | default([])
             | select('search', '(?i)usb://.*' ~ printer_model_match)
             | map('regex_replace', '^\S+\s+', '') | list }}
        ppd_candidates: >-
          {{ lpinfo_models.stdout_lines | default([])
             | select('search', '(?i)' ~ printer_model_match)
             | map('regex_replace', '\s.*$', '') | list }}
        ppd_preferred: "{{ ppd_candidates | select('search', '(?i)foo2') | list }}"
      ansible.builtin.set_fact:
        printer_uri: "{{ uri_candidates | first | default('') }}"
        printer_ppd_resolved: "{{ printer_ppd if printer_ppd | length > 0 else ((ppd_preferred + ppd_candidates) | first | default('')) }}"

    - name: Show what will be used
      ansible.builtin.debug:
        msg:
          - "Device: {{ printer_uri | default('NOT FOUND', true) }}"
          - "Driver: {{ printer_ppd_resolved | default('NOT FOUND', true) }}"

    - name: Require printer and driver
      ansible.builtin.assert:
        that:
          - printer_uri | length > 0
          - printer_ppd_resolved | length > 0
        fail_msg: >-
          Printer or driver not found. Check the printer is on and plugged into the Pi,
          then run `lpinfo -v` and `lpinfo -m | grep -i {{ printer_model_match }}` on the Pi.
          You can pin a driver with printer_ppd in group_vars/all.yml.
      when: not ansible_check_mode

    # cupsd persists each queue in printers.conf, one attribute per line (written up to 30 s after a change).
    # Empty when the queue does not exist.
    - name: Read current queue
      ansible.builtin.command: awk '/^<Printer {{ printer_name }}>$/,/^<\/Printer>$/' /etc/cups/printers.conf
      register: queue_state
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Create or update the queue
      vars:
        # `lpinfo -m` prints "<ppd-name> <model description>"; cupsd stores the description as MakeModel.
        ppd_model: >-
          {{ lpinfo_models.stdout_lines | default([])
             | select('match', (printer_ppd_resolved | regex_escape) ~ '\s')
             | map('regex_replace', '^\S+\s+', '') | first | default('') }}
        declared:
          - "DeviceURI {{ printer_uri }}"
          - "Info {{ printer_description }}"
          - "Location {{ printer_location }}"
          - "MakeModel {{ ppd_model }}"
          - "Shared Yes"
          - "ErrorPolicy retry-job"  # without it one failed backend run stops the queue for good
      ansible.builtin.command: >-
        lpadmin -p {{ printer_name }} -E
        -v "{{ printer_uri }}"
        -m "{{ printer_ppd_resolved }}"
        -D "{{ printer_description }}"
        -L "{{ printer_location }}"
        -o printer-is-shared=true
        -o printer-error-policy=retry-job
      changed_when: true  # only runs when the queue is missing or any declared attribute differs
      when: declared | difference(queue_state.stdout_lines) | length > 0

    - name: Read current queue defaults
      ansible.builtin.command: lpoptions -p {{ printer_name }} -l
      register: lpoptions_current
      changed_when: false
      failed_when: false
      check_mode: false

    # lpoptions marks the current default with "*", e.g. "Density/Print Density: Density1 ... *Density3 ..."
    - name: Set queue defaults
      ansible.builtin.command: lpadmin -p {{ printer_name }} -o {{ item.key }}={{ item.value }}
      loop: "{{ printer_options | dict2items }}"
      loop_control:
        label: "{{ item.key }}={{ item.value }}"
      changed_when: true  # only runs for options whose default differs
      when: >-
        lpoptions_current.stdout_lines
        | select('match', item.key ~ '/')
        | select('search', '\*' ~ (item.value | regex_escape) ~ '(\s|$)')
        | list | length == 0

    - name: Make it the default queue
      ansible.builtin.command: lpadmin -d {{ printer_name }}
      changed_when: false  # idempotent; re-asserted every run

    - name: Ensure queue is enabled and accepting jobs
      ansible.builtin.command: "{{ item }} {{ printer_name }}"
      loop: [cupsenable, cupsaccept]
      changed_when: false  # idempotent; re-asserted every run
