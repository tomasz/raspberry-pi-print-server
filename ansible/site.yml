---
# Declarative AirPrint print server for a USB printer on Raspberry Pi OS Lite (Trixie).
# Dry run:  ansible-playbook site.yml --check --diff
# Apply:    ansible-playbook site.yml

- name: AirPrint print server
  hosts: printsrv
  become: true

  vars:
    # Outbound traffic allowed when egress_policy is "restricted".
    egress_allowed:
      - { to_port: "53", proto: any, comment: dns }
      - { to_port: "123", proto: udp, comment: ntp }
      - { to_port: "80", proto: tcp, comment: apt-http }
      - { to_port: "443", proto: tcp, comment: apt-https }
      - { to_port: "67", proto: udp, comment: dhcp-renew }
      - { to_port: "5353", proto: udp, comment: mdns-announce }
      - { from_port: "5353", proto: udp, comment: mdns-unicast-reply }

  handlers:
    - name: Apply sysctl
      ansible.builtin.command: sysctl -e -p /etc/sysctl.d/90-hardening.conf  # -e: skip keys this kernel lacks
      changed_when: true

    - name: Restart ssh
      ansible.builtin.service:
        name: ssh
        state: restarted

    - name: Restart cups
      ansible.builtin.service:
        name: cups
        state: restarted

    - name: Restart avahi
      ansible.builtin.service:
        name: avahi-daemon
        state: restarted

    - name: Reboot
      ansible.builtin.reboot:
        reboot_timeout: 600
      when: not (image_build | default(false))  # the image build pre-applies boot config; nothing to reboot

  tasks:
    # ---------- Base system ----------
    - name: Set timezone
      community.general.timezone:
        name: "{{ timezone }}"

    # Tags: the image build runs only `packages`; the Pi's first boot skips `upgrade` (works offline).
    - name: Upgrade system packages
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
        upgrade: safe
      tags: [packages, upgrade]

    - name: Install packages
      ansible.builtin.apt:
        name: "{{ ['cups', 'cups-filters', 'avahi-daemon', 'ufw', 'unattended-upgrades', 'apt-listchanges'] + driver_packages }}"
        state: present
      tags: [packages]

    # Tag `bootconfig`: also applied at image build time, so the first boot needs no reboot.
    - name: Disable Bluetooth (unused attack surface)
      ansible.builtin.lineinfile:
        path: /boot/firmware/config.txt
        line: dtoverlay=disable-bt
        insertafter: EOF
      notify: Reboot
      tags: [bootconfig]

    - name: Disable Wi-Fi (wired via PoE; unused attack surface)
      ansible.builtin.lineinfile:
        path: /boot/firmware/config.txt
        line: dtoverlay=disable-wifi
        insertafter: EOF
      notify: Reboot
      tags: [bootconfig]

    - name: Quieter PoE+ HAT fan (starts at 65 °C instead of ~40 °C)
      ansible.builtin.blockinfile:
        path: /boot/firmware/config.txt
        marker: "# {mark} ANSIBLE poe-fan"
        block: |
          dtparam=poe_fan_temp0=65000,poe_fan_temp0_hyst=5000
          dtparam=poe_fan_temp1=70000,poe_fan_temp1_hyst=2000
          dtparam=poe_fan_temp2=75000,poe_fan_temp2_hyst=2000
          dtparam=poe_fan_temp3=80000,poe_fan_temp3_hyst=2000
      notify: Reboot
      tags: [bootconfig]

    - name: Stop Bluetooth UART service
      ansible.builtin.service:
        name: hciuart
        enabled: false
        state: stopped
      failed_when: false

    # ---------- SSH hardening ----------
    - name: Harden sshd
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/10-hardening.conf
        content: |
          # {{ ansible_managed }}
          # Key-only login for one user; no tunnels or forwarding of any kind.
          AllowUsers {{ admin_user }}
          AuthenticationMethods publickey
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PermitEmptyPasswords no
          PermitRootLogin no
          PermitUserEnvironment no
          AllowTcpForwarding no
          AllowStreamLocalForwarding no
          AllowAgentForwarding no
          X11Forwarding no
          PermitTunnel no
          GatewayPorts no
          MaxAuthTries 3
          MaxSessions 4
          LoginGraceTime 20
          ClientAliveInterval 300
          ClientAliveCountMax 2
          LogLevel VERBOSE
        mode: "0644"
        validate: /usr/sbin/sshd -t -f %s
      notify: Restart ssh

    # ---------- Kernel ----------
    - name: Harden kernel network and memory settings
      ansible.builtin.template:
        src: 90-hardening.conf.j2
        dest: /etc/sysctl.d/90-hardening.conf
        mode: "0644"
      notify: Apply sysctl

    # ---------- Automatic security updates ----------
    - name: Enable periodic unattended upgrades
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
        mode: "0644"

    - name: Configure unattended-upgrades origins and reboot window
      ansible.builtin.template:
        src: 52unattended-upgrades-local.j2
        dest: /etc/apt/apt.conf.d/52unattended-upgrades-local
        mode: "0644"

    # ---------- Firewall ----------
    # Inbound: SSH, IPP and mDNS from the LAN only; everything else dropped.
    - name: Allow LAN-only services
      community.general.ufw:
        rule: "{{ item.rule }}"
        src: "{{ lan_cidr }}"
        port: "{{ item.port }}"
        proto: "{{ item.proto }}"
        comment: "{{ item.comment }}"
      loop:
        # "limit" replaces an existing plain "allow" for the same port in place.
        - { rule: limit, port: "22", proto: tcp, comment: ssh }  # max 6 new connections per 30 s
        - { rule: allow, port: "631", proto: tcp, comment: ipp-airprint }
        - { rule: allow, port: "5353", proto: udp, comment: mdns }

    # Outbound: only what the Pi itself needs. A compromised print service cannot
    # reach arbitrary hosts. Allowed before the default flips to deny, so a run
    # never cuts off its own package downloads.
    - name: Allow required outbound traffic
      community.general.ufw:
        rule: allow
        direction: out
        to_port: "{{ item.to_port | default(omit) }}"
        from_port: "{{ item.from_port | default(omit) }}"
        proto: "{{ item.proto }}"
        comment: "{{ item.comment }}"
      loop: "{{ egress_allowed }}"
      loop_control:
        label: "{{ item.comment }}"
      when: egress_policy == 'restricted'

    - name: Deny everything else inbound and enable firewall
      community.general.ufw:
        state: enabled
        direction: incoming
        policy: deny

    - name: Set the outbound default  # noqa: args[module] -- value is templated
      community.general.ufw:
        direction: outgoing
        policy: "{{ 'deny' if egress_policy == 'restricted' else 'allow' }}"

    - name: Drop forwarded traffic (not a router)
      community.general.ufw:
        direction: routed
        policy: deny

    # ---------- mDNS ----------
    - name: Advertise over IPv4 only (firewall rules are IPv4 LAN-only)
      community.general.ini_file:
        path: /etc/avahi/avahi-daemon.conf
        section: "{{ item.section }}"
        option: "{{ item.option }}"
        value: "{{ item.value }}"
        no_extra_spaces: true  # avahi rejects "key = value"
        mode: "0644"
      loop:
        - { section: server, option: use-ipv6, value: "no" }
        - { section: publish, option: publish-aaaa-on-ipv4, value: "no" }
      notify: Restart avahi

    - name: Enable Avahi
      ansible.builtin.service:
        name: avahi-daemon
        enabled: true
        state: started

    # ---------- CUPS ----------
    - name: Configure cupsd
      ansible.builtin.template:
        src: cupsd.conf.j2
        dest: /etc/cups/cupsd.conf
        owner: root
        group: lp
        mode: "0640"
        validate: /usr/sbin/cupsd -t -c %s
      notify: Restart cups

    - name: Enable CUPS
      ansible.builtin.service:
        name: cups
        enabled: true
        state: started

    # cups-browsed finds remote printers and adds them locally. This box only serves
    # printers, and cups-browsed was the entry point of the 2024 CUPS remote code
    # execution chain (CVE-2024-47176).
    - name: Disable printer auto-discovery (cups-browsed)
      ansible.builtin.systemd_service:
        name: cups-browsed
        enabled: false
        masked: true
        state: stopped
      failed_when: false  # not installed is fine

    - name: Apply pending service restarts before configuring the queue
      ansible.builtin.meta: flush_handlers

    # ---------- Printer queue ----------
    - name: Discover USB printers
      ansible.builtin.command: lpinfo --include-schemes usb -v
      register: lpinfo_devices
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Discover drivers
      ansible.builtin.command: lpinfo -m
      register: lpinfo_models
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Resolve device URI and driver
      vars:
        uri_candidates: >-
          {{ lpinfo_devices.stdout_lines | default([])
             | select('search', '(?i)usb://.*' ~ printer_model_match)
             | map('regex_replace', '^\S+\s+', '') | list }}
        ppd_candidates: >-
          {{ lpinfo_models.stdout_lines | default([])
             | select('search', '(?i)' ~ printer_model_match)
             | map('regex_replace', '\s.*$', '') | list }}
        ppd_preferred: "{{ ppd_candidates | select('search', '(?i)foo2') | list }}"
      ansible.builtin.set_fact:
        printer_uri: "{{ uri_candidates | first | default('') }}"
        printer_ppd_resolved: "{{ printer_ppd if printer_ppd | length > 0 else ((ppd_preferred + ppd_candidates) | first | default('')) }}"

    - name: Show what will be used
      ansible.builtin.debug:
        msg:
          - "Device: {{ printer_uri | default('NOT FOUND', true) }}"
          - "Driver: {{ printer_ppd_resolved | default('NOT FOUND', true) }}"

    - name: Require printer and driver
      ansible.builtin.assert:
        that:
          - printer_uri | length > 0
          - printer_ppd_resolved | length > 0
        fail_msg: >-
          Printer or driver not found. Check the printer is on and plugged into the Pi,
          then run `lpinfo -v` and `lpinfo -m | grep -i {{ printer_model_match }}` on the Pi.
          You can pin a driver with printer_ppd in group_vars/all.yml.
      when: not ansible_check_mode

    - name: Read current queue
      ansible.builtin.command: lpstat -v {{ printer_name }}
      register: lpstat_queue
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Create or update the queue
      ansible.builtin.command: >-
        lpadmin -p {{ printer_name }} -E
        -v "{{ printer_uri }}"
        -m "{{ printer_ppd_resolved }}"
        -D "{{ printer_description }}"
        -L "{{ printer_location }}"
        -o printer-is-shared=true
      changed_when: true  # only runs when the queue is missing or points elsewhere
      when: lpstat_queue.rc != 0 or printer_uri not in lpstat_queue.stdout

    - name: Read current queue defaults
      ansible.builtin.command: lpoptions -p {{ printer_name }} -l
      register: lpoptions_current
      changed_when: false
      failed_when: false
      check_mode: false

    # lpoptions marks the current default with "*", e.g. "Density/Print Density: Density1 ... *Density3 ..."
    - name: Set queue defaults
      ansible.builtin.command: lpadmin -p {{ printer_name }} -o {{ item.key }}={{ item.value }}
      loop: "{{ printer_options | dict2items }}"
      loop_control:
        label: "{{ item.key }}={{ item.value }}"
      changed_when: true  # only runs for options whose default differs
      when: >-
        lpoptions_current.stdout_lines
        | select('match', item.key ~ '/')
        | select('search', '\*' ~ (item.value | regex_escape) ~ '(\s|$)')
        | list | length == 0

    - name: Make it the default queue
      ansible.builtin.command: lpadmin -d {{ printer_name }}
      changed_when: false  # idempotent; re-asserted every run

    - name: Ensure queue is enabled and accepting jobs
      ansible.builtin.command: "{{ item }} {{ printer_name }}"
      loop: [cupsenable, cupsaccept]
      changed_when: false  # idempotent; re-asserted every run
